<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Professional Scanner</title>

<script src="https://unpkg.com/quagga/dist/quagga.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body { background:#000; color:#fff; font-family:sans-serif; }
.main-container { padding:10px; text-align:center; }

#reader-wrapper {
    position:relative;
    max-width:600px;
    margin:auto;
    border-radius:20px;
    overflow:hidden;
    border:2px solid #444;
    display:none;
}

#reader { width:100%; }

.custom-laser {
    position:absolute;
    width:100%;
    height:2px;
    background:#00ff00;
    box-shadow:0 0 15px #00ff00;
    top:50%;
    animation:moveLaser 2.5s infinite;
}

@keyframes moveLaser {
    0%{top:25%}
    50%{top:75%}
    100%{top:25%}
}

#result-card {
    display:none;
    background:#fff;
    color:#000;
    padding:20px;
    border-radius:20px;
    margin-top:20px;
}

.btn-init {
    background:#28a745;
    color:white;
    padding:15px 40px;
    border-radius:50px;
    border:none;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="main-container">

<h4 class="mt-3 text-success">PRO SCANNER</h4>

<div id="init-btn-group">
    <button class="btn-init" onclick="initScanner()">KAMERANI YOQISH</button>
</div>

<div id="reader-wrapper">
    <div class="custom-laser"></div>
    <div id="reader"></div>
</div>

<div id="result-card">
    <h5 class="text-success">Skanerlandi</h5>
    <p id="display-barcode"></p>

    <form method="POST" action="{% url 'product_create' %}">
        {% csrf_token %}
        <input type="hidden" name="barcode" id="barcode">

        <input type="text" name="name" class="form-control mb-2" placeholder="Mahsulot nomi" required>
        <input type="number" name="sale_price" class="form-control mb-2" placeholder="Narx" required>

        <button class="btn btn-primary w-100">Saqlash</button>
    </form>
</div>

</div>

<audio id="beep" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

<script>

let started = false;
let lastResults = [];

const beep = document.getElementById("beep");


// 🔥 GS1 parser
function extractGTIN(code){
    let match = code.match(/01(\d{14})/);
    if(match) return match[1];
    return code;
}


// 🔥 FILTER (ENG MUHIM)
function getStableCode(code){

    lastResults.push(code);

    if(lastResults.length > 6){
        lastResults.shift();
    }

    let counts = {};

    lastResults.forEach(c => {
        counts[c] = (counts[c] || 0) + 1;
    });

    for(let key in counts){
        if(counts[key] >= 3){
            return key; // tasdiqlangan kod
        }
    }

    return null;
}


function initScanner(){

    if(started) return;
    started = true;

    document.getElementById("init-btn-group").style.display = "none";
    document.getElementById("reader-wrapper").style.display = "block";

    Quagga.init({
        inputStream: {
            type: "LiveStream",
            target: document.querySelector('#reader'),
            constraints: {
                facingMode: { ideal: "environment" }
            }
        },

        locator: {
            patchSize: "large",
            halfSample: false
        },

        decoder: {
            readers: [
                "code_128_reader",
                "ean_reader",
                "ean_8_reader",
                "code_39_reader",
                "i2of5_reader"
            ]
        }

    }, function(err){
        if(err){
            alert("Kamera ishlamadi");
            return;
        }
        Quagga.start();
    });

    Quagga.onDetected(function(data){

        let raw = data.codeResult.code;
        let clean = extractGTIN(raw);

        let valid = getStableCode(clean);

        if(!valid) return; // hali tasdiqlanmadi

        beep.play();
        Quagga.stop();

        document.getElementById("display-barcode").innerText = valid;
        document.getElementById("barcode").value = valid;

        document.getElementById("reader-wrapper").style.display = "none";
        document.getElementById("result-card").style.display = "block";

    });
}

</script>

</body>
</html>
