<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Logistik Skaner</title>

    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        body { background-color: #f0f2f5; font-family: sans-serif; }

        .scanner-card {
            border: none;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            background: #fff;
        }

        #reader-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            min-height: 400px;
        }

        #reader { width: 100% !important; border: none !important; }

        /* 🟢 LAZER CHIZIG'I - UZUN KODLAR UCHUN */
        .laser-line {
            position: absolute;
            top: 10%; left: 0;
            width: 100%; height: 4px;
            background: #00ff00;
            box-shadow: 0 0 20px #00ff00;
            z-index: 10;
            animation: scanMove 3s infinite ease-in-out;
        }

        @keyframes scanMove {
            0% { top: 10%; }
            50% { top: 90%; }
            100% { top: 10%; }
        }

        #form-box { display: none; padding: 25px; }
        .scanned-header {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
            word-break: break-all; /* Uzun kodlar sig'ishi uchun */
        }
    </style>
</head>

<body class="py-3">

<div class="container">
    <div class="card scanner-card mx-auto" style="max-width: 600px;">

        <!-- 📷 MAKSIMAL KENGLIKDAGI SKANER -->
        <div id="reader-wrapper">
            <div class="laser-line"></div>
            <div id="reader"></div>
        </div>

        <div class="card-body p-0 text-center py-2" id="hint-text">
            <small class="text-muted">Shtrix-kodni yashil chiziqning o'rtasiga tekis tuting</small>
        </div>

        <div class="card-body p-0">
            <div id="form-box">
                <div class="scanned-header">
                    <i class="fas fa-barcode me-2"></i> KOD: <br>
                    <span id="scanned-code-text" style="font-size: 14px;"></span>
                </div>

                <form method="POST" action="{% url 'product_create' %}">
                    {% csrf_token %}
                    <input type="hidden" name="barcode" id="barcode_hidden">

                    <div class="mb-3">
                        <label class="form-label fw-bold">Mahsulot nomi</label>
                        <input type="text" name="name" class="form-control form-control-lg" placeholder="Nomi..." required>
                    </div>

                    <div class="row g-2">
                        <div class="col-6 mb-3">
                            <label class="form-label fw-bold small text-uppercase">SKU / Kod</label>
                            <input type="text" name="sku" class="form-control">
                        </div>
                        <div class="col-6 mb-3">
                            <label class="form-label fw-bold small text-uppercase">Olish narxi</label>
                            <input type="number" name="purchase_price" class="form-control">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold small text-uppercase">Sotish narxi</label>
                        <input type="number" name="sale_price" class="form-control form-control-lg" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 btn-lg shadow">
                        <i class="fas fa-save me-2"></i> SAQLASH
                    </button>

                    <button type="button" onclick="location.reload()" class="btn btn-link w-100 mt-2 text-muted">
                        Qayta skanerlash
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<audio id="beep" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

<script>
const html5QrCode = new Html5Qrcode("reader");
const beep = document.getElementById("beep");

function onScanSuccess(decodedText) {
    html5QrCode.stop().then(() => {
        beep.play();

        document.getElementById("barcode_hidden").value = decodedText;
        document.getElementById("scanned-code-text").innerText = decodedText;

        document.getElementById("reader-wrapper").style.display = "none";
        document.getElementById("hint-text").style.display = "none";
        document.getElementById("form-box").style.display = "block";
    });
}

function startScanner() {
    // 📏 RASMDAGI UZUN KODLAR UCHUN MAXSUS O'LCHAM (95% kenglik)
    const qrboxFunction = function(viewfinderWidth, viewfinderHeight) {
        let width = Math.floor(viewfinderWidth * 0.95);
        let height = Math.floor(viewfinderWidth * 0.45); // Uzun kodlar uchun to'rtburchak
        return { width: width, height: height };
    }

    const config = {
        fps: 30,
        qrbox: qrboxFunction,
        // 🔥 KAMERA ANIQLIGINI MAKSIMAL QILISH (HD format)
        videoConstraints: {
            facingMode: "environment",
            width: { min: 1280, ideal: 1920, max: 2560 },
            height: { min: 720, ideal: 1080, max: 1440 },
            focusMode: "continuous"
        },
        // 🔥 FAQAT KERAKLI FORMATLARNI QIDIRISH (Tezlik va aniqlik uchun)
        formatsToSupport: [
            Html5QrcodeSupportedFormats.CODE_128, // Sizning rasmdagi kod turi
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.CODE_39
        ]
    };

    html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
    .catch(err => {
        console.error("Xato:", err);
        alert("Kameraga ruxsat berilmagan yoki xatolik yuz berdi.");
    });
}

startScanner();
</script>

</body>
</html>
