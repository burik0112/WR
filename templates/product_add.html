<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DEBUG Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body { background:#000; color:#fff; text-align:center; }
#reader { width:100%; max-width:400px; margin:auto; }
#result { margin-top:20px; font-size:18px; }
.good { color:lime; }
.bad { color:red; }
</style>
</head>

<body>

<h3>DEBUG SCANNER</h3>

<div id="reader"></div>

<div id="result">Kutilyapti...</div>

<script>

const resultBox = document.getElementById("result");

function extractGTIN(code){
    let match = code.match(/01(\d{14})/);
    if(match) return match[1];
    return code;
}

const html5QrCode = new Html5Qrcode("reader");

html5QrCode.start(
    { facingMode: "environment" },
    {
        fps: 10,
        qrbox: { width: 250, height: 100 },
        formatsToSupport: [
            Html5QrcodeSupportedFormats.CODE_128
        ],
        experimentalFeatures: {
            useBarCodeDetectorIfSupported: true
        }
    },
    (decodedText) => {

        let clean = extractGTIN(decodedText);

        // 👇 HAR SAFAR KO‘RSATADI
        resultBox.innerHTML = `
            RAW: ${decodedText} <br>
            CLEAN: ${clean}
        `;

    },
    (err) => {}
);

</script>

</body>
</html>
