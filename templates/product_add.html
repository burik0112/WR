<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Max Skaner</title>

    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        body { background-color: #f0f2f5; }

        /* 📱 SKANER KONTEYNERI - EKRANGA MOS */
        .scanner-card {
            border: none;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            background: #fff;
        }

        #reader-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            /* Kamera qismini balandroq qilish */
            min-height: 400px;
        }

        #reader { width: 100% !important; border: none !important; }

        /* 🟢 LASER CHIZIG'I - KATTA VA YORQIN */
        .laser-line {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 4px;
            background: #00ff00;
            box-shadow: 0 0 20px #00ff00;
            z-index: 10;
            animation: scanMove 3s infinite ease-in-out;
        }

        @keyframes scanMove {
            0% { top: 5%; }
            50% { top: 95%; }
            100% { top: 5%; }
        }

        /* SKANERLANGAN HOLAT */
        #form-box { display: none; padding: 25px; }
        .scanned-header {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
        }
    </style>
</head>

<body class="py-3">

<div class="container">
    <div class="card scanner-card mx-auto" style="max-width: 600px;">

        <!-- 📷 MAKSIMAL SKANER OYNASI -->
        <div id="reader-wrapper">
            <div class="laser-line"></div>
            <div id="reader"></div>
        </div>

        <div class="card-body p-0">
            <!-- NATIJA -->
            <div id="form-box">
                <div class="scanned-header">
                    <i class="fas fa-barcode me-2"></i> KOD: <span id="scanned-code-text"></span>
                </div>

                <form method="POST" action="{% url 'product_create' %}">
                    {% csrf_token %}
                    <input type="hidden" name="barcode" id="barcode_hidden">

                    <div class="mb-3">
                        <label class="form-label fw-bold">Mahsulot nomi</label>
                        <input type="text" name="name" class="form-control form-control-lg" placeholder="Nomi..." required>
                    </div>

                    <div class="row g-2">
                        <div class="col-6 mb-3">
                            <label class="form-label fw-bold">SKU</label>
                            <input type="text" name="sku" class="form-control form-control-lg">
                        </div>
                        <div class="col-6 mb-3">
                            <label class="form-label fw-bold">Olish narxi</label>
                            <input type="number" name="purchase_price" class="form-control form-control-lg">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Sotish narxi</label>
                        <input type="number" name="sale_price" class="form-control form-control-lg" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 btn-lg shadow">
                        <i class="fas fa-check-circle me-2"></i> TIZIMGA SAQLASH
                    </button>

                    <button type="button" onclick="location.reload()" class="btn btn-link w-100 mt-3 text-muted">
                        Qayta skanerlash
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<audio id="beep" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

<script>
const html5QrCode = new Html5Qrcode("reader");
const beep = document.getElementById("beep");

function onScanSuccess(decodedText) {
    html5QrCode.stop().then(() => {
        beep.play();

        document.getElementById("barcode_hidden").value = decodedText;
        document.getElementById("scanned-code-text").innerText = decodedText;

        document.getElementById("reader-wrapper").style.display = "none";
        document.getElementById("form-box").style.display = "block";
    });
}

function startScanner() {
    // 📏 MAKSIMAL O'LCHAMNI HISOBLASH FUNKSIYASI
    const qrboxFunction = function(viewfinderWidth, viewfinderHeight) {
        // Kenglikning 90% qismini skaner maydoni qilamiz
        let minEdgePercentage = 0.9;
        let minEdgeSize = Math.min(viewfinderWidth, viewfinderHeight);
        let qrboxSize = Math.floor(minEdgeSize * minEdgePercentage);

        return {
            width: qrboxSize, // Juda keng
            height: Math.floor(qrboxSize * 0.5) // Shtrix kod uchun to'rtburchak (balandligi kengligining yarmi)
        };
    }

    html5QrCode.start(
        { facingMode: "environment" },
        {
            fps: 30, // Tezlikni maksimal qildik
            qrbox: qrboxFunction, // Dinamik va katta oyna
            aspectRatio: 1.0 // Kamera fokusini buzmaslik uchun
        },
        onScanSuccess
    ).catch(err => console.error("Xato:", err));
}

// Sahifa ochilishi bilan boshlash
startScanner();
</script>

</body>
</html>
