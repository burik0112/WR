<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Industrial Pro Scanner</title>

    <!-- Kutubxonani yuklash -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 0; }
        .main-container { padding: 15px; }

        /* SKANER OYNASI */
        #reader {
            width: 100% !important;
            border-radius: 15px;
            overflow: hidden;
            background: #111;
            border: 2px solid #333 !important;
        }

        /* LASER ANIMATSIYASI */
        .scan-region-highlight {
            border: 3px solid #00ff00 !important;
            border-radius: 10px;
        }

        .custom-laser {
            position: absolute; width: 100%; height: 3px;
            background: #00ff00; box-shadow: 0 0 15px #00ff00;
            top: 50%; z-index: 100; pointer-events: none;
            animation: moveLaser 2.5s infinite ease-in-out;
        }
        @keyframes moveLaser {
            0% { top: 30%; } 50% { top: 70%; } 100% { top: 30%; }
        }

        /* NATIJA QISMI */
        #result-card {
            display: none; background: #fff; color: #000;
            padding: 20px; border-radius: 20px; margin-top: 20px;
        }
        .code-output {
            background: #f1f3f5; padding: 10px; border-radius: 10px;
            font-family: monospace; font-size: 14px; word-break: break-all;
            margin-bottom: 15px; border: 1px solid #dee2e6;
        }

        .btn-start {
            background: #00ff00; color: #000; font-weight: bold;
            padding: 15px 30px; border-radius: 50px; border: none;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.4);
        }
    </style>
</head>
<body>

<div class="main-container text-center">
    <h3 class="my-3 fw-bold text-success">PRO SCANNER</h3>

    <!-- Kamera boshlanishidan oldin ko'rinadigan tugma -->
    <div id="init-btn-group" class="my-5">
        <button class="btn-start" onclick="initScanner()">KAMERANI YOQISH</button>
        <p class="mt-3 text-secondary small">Eslatma: HTTPS va Kamera ruxsati shart</p>
    </div>

    <!-- SKANER MAYDONI -->
    <div style="position: relative; display: none;" id="reader-wrapper">
        <div class="custom-laser"></div>
        <div id="reader"></div>
    </div>

    <!-- NATIJA FORMASI -->
    <div id="result-card" class="shadow-lg text-start">
        <h5 class="fw-bold mb-3">Skanerlandi ✅</h5>
        <div class="code-output" id="res-barcode">---</div>

        <form method="POST" action="{% url 'product_create' %}">
            {% csrf_token %}
            <input type="hidden" name="barcode" id="input_barcode">

            <div class="mb-3">
                <label class="form-label small fw-bold text-uppercase text-muted">Mahsulot nomi</label>
                <input type="text" name="name" class="form-control" placeholder="Nomi..." required>
            </div>

            <div class="row g-2">
                <div class="col-6 mb-3">
                    <label class="form-label small fw-bold text-muted text-uppercase">Olish</label>
                    <input type="number" name="purchase_price" class="form-control" placeholder="0">
                </div>
                <div class="col-6 mb-3">
                    <label class="form-label small fw-bold text-muted text-uppercase">Sotish</label>
                    <input type="number" name="sale_price" class="form-control" placeholder="0" required>
                </div>
            </div>

            <button type="submit" class="btn btn-success w-100 py-3 fw-bold rounded-3">BAZAGA SAQLASH</button>
            <button type="button" onclick="window.location.reload()" class="btn btn-link w-100 mt-2 text-muted">Bekor qilish</button>
        </form>
    </div>
</div>

<audio id="beep" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

<script>
    let html5QrCode;
    const beep = document.getElementById("beep");

    async function initScanner() {
        document.getElementById("init-btn-group").style.display = "none";
        document.getElementById("reader-wrapper").style.display = "block";

        html5QrCode = new Html5Qrcode("reader");

        // 1. Kameralarni aniqlash
        try {
            const devices = await Html5Qrcode.getCameras();
            if (devices && devices.length) {
                // Eng oxirgi kamerani tanlash (telefonda bu odatda orqa kamera bo'ladi)
                const cameraId = devices[devices.length - 1].id;
                startScanning(cameraId);
            } else {
                // Agar kameralar ro'yxati kelmasa, facingMode bilan urinib ko'ramiz
                startScanning({ facingMode: "environment" });
            }
        } catch (err) {
            console.error(err);
            alert("Kamera topilmadi yoki ruxsat berilmagan!");
        }
    }

    function startScanning(cameraIdentifier) {
        // Uzun shtrix-kodlar (GS1-128) uchun oyna o'lchami (90% keng, 35% baland)
        const qrboxFunction = (viewfinderWidth, viewfinderHeight) => {
            let width = Math.floor(viewfinderWidth * 0.9);
            let height = Math.floor(viewfinderWidth * 0.35);
            return { width: width, height: height };
        }

        const config = {
            fps: 30, // Tezlikni oshirdik
            qrbox: qrboxFunction,
            // Rasmdagi uzun Code 128 (GS1-128) formatiga ustunlik beramiz
            formatsToSupport: [ Html5QrcodeSupportedFormats.CODE_128 ],
            aspectRatio: 1.777778 // 16:9 formatda kamera ochilishi uchun
        };

        html5QrCode.start(
            cameraIdentifier,
            config,
            (decodedText) => {
                // SUCCESS
                beep.play();
                html5QrCode.stop().then(() => {
                    document.getElementById("reader-wrapper").style.display = "none";
                    document.getElementById("result-card").style.display = "block";
                    document.getElementById("res-barcode").innerText = decodedText;
                    document.getElementById("input_barcode").value = decodedText;
                });
            },
            (errorMessage) => {
                // Skanerlash jarayonidagi xatolar (logga chiqadi, alert emas)
            }
        ).catch(err => {
            alert("Skanerlashda xato: " + err);
        });
    }
</script>

</body>
</html>
