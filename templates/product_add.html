<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Scanner</title>

    <!-- 🔥 Quagga -->
    <script src="https://unpkg.com/quagga/dist/quagga.min.js"></script>

    <!-- UI -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background:#f0f2f5; font-family:sans-serif; }

        .scanner-card {
            border-radius:20px;
            overflow:hidden;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
        }

        #reader-wrapper {
            position:relative;
            background:#000;
            min-height:350px;
        }

        #scanner {
            width:100%;
        }

        .laser {
            position:absolute;
            width:100%;
            height:3px;
            background:#00ff00;
            box-shadow:0 0 10px #00ff00;
            animation:move 3s infinite;
        }

        @keyframes move {
            0%{top:10%}
            50%{top:90%}
            100%{top:10%}
        }

        #form-box { display:none; padding:20px; }
    </style>
</head>

<body class="p-3">

<div class="container">
<div class="card scanner-card mx-auto" style="max-width:600px;">

    <!-- CAMERA -->
    <div id="reader-wrapper">
        <div class="laser"></div>
        <div id="scanner"></div>
    </div>

    <div class="text-center py-2" id="hint">
        <small>Kodni markazga tuting</small>
    </div>

    <!-- FORM -->
    <div id="form-box">

        <h5 class="text-success">Skanerlandi:</h5>
        <p id="code" class="fw-bold"></p>

        <form method="POST" action="{% url 'product_create' %}">
            {% csrf_token %}

            <input type="hidden" name="barcode" id="barcode">

            <input type="text" name="name" placeholder="Product name" class="form-control mb-2" required>

            <input type="text" name="sku" placeholder="SKU" class="form-control mb-2">

            <input type="number" name="purchase_price" placeholder="Purchase" class="form-control mb-2">

            <input type="number" name="sale_price" placeholder="Sale" class="form-control mb-3" required>

            <button class="btn btn-primary w-100">Save</button>
        </form>

        <button onclick="location.reload()" class="btn btn-link w-100 mt-2">Qayta scan</button>

    </div>

</div>
</div>

<audio id="beep" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

<script>

const beep = document.getElementById("beep");

Quagga.init({
    inputStream: {
        type: "LiveStream",
        target: document.querySelector('#scanner'),
        constraints: {
            facingMode: "environment",
            width: { min: 1280 },
            height: { min: 720 }
        }
    },

    locator: {
        patchSize: "medium",
        halfSample: false
    },

    numOfWorkers: navigator.hardwareConcurrency || 4,

    decoder: {
        readers: [
            "code_128_reader",
            "ean_reader",
            "ean_8_reader",
            "code_39_reader",
            "i2of5_reader"
        ]
    },

    locate: true

}, function(err) {
    if (err) {
        alert("Camera error");
        return;
    }
    Quagga.start();
});

Quagga.onDetected(function(data){

    let code = data.codeResult.code;

    beep.play();

    Quagga.stop();

    document.getElementById("barcode").value = code;
    document.getElementById("code").innerText = code;

    document.getElementById("reader-wrapper").style.display = "none";
    document.getElementById("hint").style.display = "none";
    document.getElementById("form-box").style.display = "block";

});

</script>

</body>
</html>
