<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Ultra-Sharp Pro Scanner</title>

    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; }
        .main-container { padding: 10px; }

        /* 📱 SKANER OYNASI */
        #reader-wrapper {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: auto;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid #444;
            display: none;
        }

        #reader { width: 100% !important; border: none !important; }

        /* 🟢 LASER ANIMATSIYASI */
        .custom-laser {
            position: absolute; width: 100%; height: 2px;
            background: #00ff00; box-shadow: 0 0 15px #00ff00;
            top: 50%; z-index: 100; pointer-events: none;
            animation: moveLaser 2.5s infinite ease-in-out;
        }
        @keyframes moveLaser {
            0% { top: 25%; } 50% { top: 75%; } 100% { top: 25%; }
        }

        /* 📝 FORM QISMI */
        #result-card {
            display: none; background: #fff; color: #000;
            padding: 20px; border-radius: 25px; margin-top: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .btn-init {
            background: #28a745; color: white; padding: 15px 40px;
            border-radius: 50px; border: none; font-weight: bold;
            font-size: 18px; margin-top: 100px;
        }
    </style>
</head>
<body>

<div class="main-container text-center">
    <h4 class="mt-3 mb-4 text-success fw-bold">PRO SCANNER <span class="text-white">v2.0</span></h4>

    <!-- Yoqish tugmasi -->
    <div id="init-btn-group">
        <button class="btn-init shadow-lg" onclick="initScanner()">KAMERANI YOQISH</button>
        <p class="mt-3 text-secondary small">Kamera tiniq rejimda ishga tushadi</p>
    </div>

    <!-- Skaner maydoni -->
    <div id="reader-wrapper">
        <div class="custom-laser"></div>
        <div id="reader"></div>
    </div>

    <!-- Natija -->
    <div id="result-card" class="text-start">
        <h5 class="fw-bold mb-3 text-success">Skanerlandi ✅</h5>
        <div id="display-barcode" class="p-2 mb-3 bg-light border rounded font-monospace small"></div>

        <form method="POST" action="{% url 'product_create' %}">
            {% csrf_token %}
            <input type="hidden" name="barcode" id="input_barcode">
            <div class="mb-3">
                <label class="form-label small fw-bold">MAHSULOT NOMI</label>
                <input type="text" name="name" class="form-control" required>
            </div>
            <div class="row g-2 mb-4">
                <div class="col-6"><input type="number" name="purchase_price" class="form-control" placeholder="Olish"></div>
                <div class="col-6"><input type="number" name="sale_price" class="form-control" placeholder="Sotish" required></div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-3 fw-bold rounded-3">SAQLASH</button>
            <button type="button" onclick="window.location.reload()" class="btn btn-link w-100 mt-2 text-muted">Bekor qilish</button>
        </form>
    </div>
</div>

<audio id="beep" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

<script>
    let html5QrCode;
    const beep = document.getElementById("beep");

    async function initScanner() {
        document.getElementById("init-btn-group").style.display = "none";
        document.getElementById("reader-wrapper").style.display = "block";

        html5QrCode = new Html5Qrcode("reader");

        // Kamerani eng yuqori sifatda (HD) va fokusli boshlash
        const config = {
            fps: 25,
            qrbox: (viewfinderWidth, viewfinderHeight) => {
                return { width: Math.floor(viewfinderWidth * 0.9), height: Math.floor(viewfinderWidth * 0.4) };
            },
            // 🔥 TINIQLIK VA FOKUS UCHUN ASOSIY SOZLAMALAR
            videoConstraints: {
                facingMode: "environment",
                width: { ideal: 1920 }, // Full HD ideal
                height: { ideal: 1080 },
                // Fokusni brauzer darajasida kuchaytirish
                focusMode: "continuous",
                whiteBalanceMode: "continuous",
                exposureMode: "continuous"
            }
        };

        // Orqa kamerani (back camera) avtomatik topish va ishga tushirish
        html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
        .catch(err => {
            console.error("Xato:", err);
            // Agar HD xato bersa, oddiy sifatda yoqish
            html5QrCode.start({ facingMode: "environment" }, { fps: 20, qrbox: {width: 300, height: 150} }, onScanSuccess);
        });
    }

    function onScanSuccess(decodedText) {
        beep.play();
        html5QrCode.stop().then(() => {
            document.getElementById("reader-wrapper").style.display = "none";
            document.getElementById("result-card").style.display = "block";
            document.getElementById("display-barcode").innerText = decodedText;
            document.getElementById("input_barcode").value = decodedText;
        });
    }
</script>

</body>
</html>
