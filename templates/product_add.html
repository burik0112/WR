<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PRO Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background:#000;
    color:#fff;
    text-align:center;
}

/* Scanner box */
#reader-wrapper {
    position:relative;
    max-width:500px;
    margin:auto;
    border-radius:20px;
    overflow:hidden;
    border:3px solid red; /* 🔴 default */
}

/* Scanner area */
#reader {
    width:100%;
}

/* Laser */
.laser {
    position:absolute;
    width:100%;
    height:3px;
    background:#00ff00;
    top:50%;
    animation:move 2s infinite;
}
@keyframes move {
    0%{top:20%}
    50%{top:80%}
    100%{top:20%}
}

/* Result */
#result-card {
    display:none;
    background:#fff;
    color:#000;
    padding:20px;
    border-radius:20px;
    margin-top:20px;
}
</style>
</head>

<body>

<h4 class="mt-3">📦 PRO SCANNER</h4>

<div id="reader-wrapper">
    <div class="laser"></div>
    <div id="reader"></div>
</div>

<div id="result-card">
    <h5 class="text-success">Skanerlandi ✅</h5>
    <p id="display-barcode"></p>

    <form method="POST" action="{% url 'product_create' %}">
        {% csrf_token %}
        <input type="hidden" name="barcode" id="barcode">

        <input type="text" name="name" class="form-control mb-2" placeholder="Mahsulot nomi" required>
        <input type="number" name="sale_price" class="form-control mb-2" placeholder="Narx" required>

        <button class="btn btn-primary w-100">Saqlash</button>
    </form>
</div>

<audio id="beep" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

<script>

const beep = document.getElementById("beep");
const wrapper = document.getElementById("reader-wrapper");

function extractGTIN(code){
    let match = code.match(/01(\d{14})/);
    if(match) return match[1];
    return code;
}

const html5QrCode = new Html5Qrcode("reader");

const config = {
    fps: 15,
    qrbox: { width: 280, height: 120 },
    formatsToSupport: [
        Html5QrcodeSupportedFormats.CODE_128
    ],
    experimentalFeatures: {
        useBarCodeDetectorIfSupported: true
    }
};

html5QrCode.start(
    { facingMode: "environment" },
    config,
    (decodedText) => {

        let clean = extractGTIN(decodedText);

        // 🔥 GREEN FRAME SUCCESS
        wrapper.style.border = "3px solid lime";

        beep.play();

        setTimeout(() => {
            html5QrCode.stop();

            document.getElementById("display-barcode").innerText = clean;
            document.getElementById("barcode").value = clean;

            document.getElementById("reader-wrapper").style.display = "none";
            document.getElementById("result-card").style.display = "block";
        }, 500);
    },
    (error) => {
        // scan noto‘g‘ri bo‘lsa qizil qoladi
        wrapper.style.border = "3px solid red";
    }
);

</script>

</body>
</html>
