<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sklad Pro Scanner</title>

    <!-- html5-qrcode kutubxonasi -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background:#1a1d20; color: white; font-family: sans-serif; }
        .scanner-container {
            width: 100%; max-width: 600px; margin: auto;
            border-radius: 20px; overflow: hidden;
            border: 2px solid #333; background: #000;
            position: relative;
        }
        #reader { width: 100% !important; }

        /* Yashil lazer chizig'i */
        .laser {
            position: absolute; width: 100%; height: 3px;
            background: #00ff00; box-shadow: 0 0 15px #00ff00;
            top: 50%; z-index: 100; pointer-events: none;
            animation: moveLaser 3s infinite ease-in-out;
        }
        @keyframes moveLaser {
            0% { top: 25%; } 50% { top: 75%; } 100% { top: 25%; }
        }

        #result-box { display: none; background: white; color: black; padding: 25px; border-radius: 20px; margin-top: 15px; }
        .code-text { background: #f8f9fa; border: 1px solid #ddd; padding: 10px; font-family: monospace; word-break: break-all; border-radius: 8px; margin-bottom: 15px; font-size: 14px; }
    </style>
</head>
<body class="p-3">

<div class="container text-center">
    <h4 class="mb-3 text-success fw-bold">📷 Professional Skaner</h4>

    <div class="scanner-container shadow-lg">
        <div class="laser"></div>
        <div id="reader"></div>
    </div>

    <div class="mt-3 text-secondary small">
        <p>💡 <b>Maslahat:</b> Kodni uzoqroqdan (30-40 sm) tuting. <br> Yashil chiziq shtrix-kodni to'liq kesib o'tishi shart.</p>
    </div>

    <!-- Skanerlangandagi forma -->
    <div id="result-box" class="shadow">
        <h5 class="fw-bold text-success">Muvaffaqiyatli!</h5>
        <div class="code-text" id="barcode-display"></div>

        <form method="POST" action="{% url 'product_create' %}">
            {% csrf_token %}
            <input type="hidden" name="barcode" id="barcode_hidden">

            <input type="text" name="name" placeholder="Mahsulot nomi" class="form-control mb-2" required>
            <div class="row g-2">
                <div class="col-6"><input type="number" name="purchase_price" placeholder="Olish" class="form-control mb-2"></div>
                <div class="col-6"><input type="number" name="sale_price" placeholder="Sotish" class="form-control mb-2" required></div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">SAQLASH</button>
            <button type="button" onclick="location.reload()" class="btn btn-link w-100 mt-2 text-muted">Qayta skanerlash</button>
        </form>
    </div>
</div>

<audio id="beep" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

<script>
    const html5QrCode = new Html5Qrcode("reader");
    const beep = document.getElementById("beep");

    function onScanSuccess(decodedText) {
        beep.play();
        html5QrCode.stop().then(() => {
            document.getElementById("barcode_hidden").value = decodedText;
            document.getElementById("barcode-display").innerText = decodedText;
            document.getElementById("reader").parentElement.style.display = "none";
            document.getElementById("result-box").style.display = "block";
        }).catch(err => console.error(err));
    }

    function startScanner() {
        // Uzun kodlar uchun oyna (95% kenglik, 40% balandlik)
        const qrboxFunction = (viewfinderWidth, viewfinderHeight) => {
            let width = Math.floor(viewfinderWidth * 0.95);
            let height = Math.floor(viewfinderWidth * 0.45);
            return { width: width, height: height };
        }

        const config = {
            fps: 20,
            qrbox: qrboxFunction,
            // Format cheklovini olib tashladik, hamma narsani o'qiydi
            aspectRatio: 1.777778
        };

        // Kamerani yoqish - Agar "environment" xato bersa, oddiy yoqadi
        html5QrCode.start(
            { facingMode: { ideal: "environment" } },
            config,
            onScanSuccess
        ).catch(err => {
            console.error(err);
            // Ikkinchi urinish (noutbuk yoki boshqa kameralar uchun)
            html5QrCode.start(true, config, onScanSuccess)
            .catch(e => alert("Kamera yoqilmadi. HTTPS va ruxsatni tekshiring."));
        });
    }

    // Sahifa yuklanganda skanerni yoqish
    window.onload = startScanner;
</script>

</body>
</html>
