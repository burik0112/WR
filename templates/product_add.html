<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Product Scan Create</title>

    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        #reader { width: 100%; border-radius: 10px; }
        #form-box { display: none; }
    </style>
</head>

<body class="bg-light">

<div class="container py-4">

    <div class="card shadow mx-auto" style="max-width: 500px;">
        <div class="card-body">

            <h4 class="text-center">📦 Mahsulot qo‘shish (Scan)</h4>

            <!-- CAMERA -->
            <div id="reader"></div>

            <!-- FORM -->
            <form method="POST" action="{% url 'product_create' %}" id="form-box" class="mt-3">
                {% csrf_token %}

                <!-- BARCODE -->
                <input type="hidden" name="barcode" id="barcode">

                <!-- PRODUCT NAME -->
                <div class="mb-2">
                    <label>Mahsulot nomi</label>
                    <input type="text" name="name" class="form-control" required>
                </div>

                <!-- SKU -->
                <div class="mb-2">
                    <label>SKU</label>
                    <input type="text" name="sku" class="form-control">
                </div>

                <!-- PURCHASE -->
                <div class="mb-2">
                    <label>Olish narxi</label>
                    <input type="number" name="purchase_price" class="form-control">
                </div>

                <!-- SALE -->
                <div class="mb-2">
                    <label>Sotish narxi</label>
                    <input type="number" name="sale_price" class="form-control">
                </div>

                <button class="btn btn-success w-100 mt-2">
                    Saqlash
                </button>
            </form>

        </div>
    </div>

</div>

<script>

let html5QrCode = new Html5Qrcode("reader");

function onScanSuccess(decodedText) {

    html5QrCode.stop();

    // barcode inputga yoziladi
    document.getElementById("barcode").value = decodedText;

    // form ochiladi
    document.getElementById("form-box").style.display = "block";

    // camera yashiriladi
    document.getElementById("reader").style.display = "none";
}

function startScanner() {
    html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        onScanSuccess
    );
}

startScanner();

</script>

</body>
</html>
