<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Industrial Pro Scanner v5.0</title>

    <!-- Kutubxonalar -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; overflow-x: hidden; }

        /* 📱 SKANER MAYDONI */
        #reader-wrapper {
            position: relative;
            width: 100%;
            max-width: 650px;
            margin: auto;
            border: 2px solid #333;
            background: #111;
            display: none; /* Tugma bosilguncha yashirin */
        }

        #reader { width: 100% !important; border: none !important; }

        /* 🟢 LAZER CHIZIG'I - UZUN KODLAR UCHUN */
        .custom-laser {
            position: absolute; width: 100%; height: 3px;
            background: #00ff00; box-shadow: 0 0 20px #00ff00;
            top: 50%; z-index: 100; pointer-events: none;
            animation: moveLaser 2.5s infinite ease-in-out;
        }
        @keyframes moveLaser {
            0% { top: 30%; } 50% { top: 70%; } 100% { top: 30%; }
        }

        /* 📝 NATIJA FORMASI */
        #result-card {
            display: none; background: #fff; color: #000;
            padding: 25px; border-radius: 25px 25px 0 0;
            position: fixed; bottom: 0; width: 100%;
            z-index: 1001; box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
        }

        .code-display {
            background: #f1f3f5; padding: 12px; border-radius: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px; word-break: break-all;
            margin-bottom: 20px; border: 1px solid #dee2e6;
        }

        .btn-init {
            background: #28a745; color: white; padding: 20px 50px;
            border-radius: 50px; border: none; font-weight: bold;
            font-size: 20px; margin-top: 150px;
            box-shadow: 0 0 30px rgba(40, 167, 69, 0.5);
        }
    </style>
</head>
<body>

<div class="container text-center">

    <!-- 1-BOSQICH: Yoqish tugmasi -->
    <div id="init-screen">
        <button class="btn-init" onclick="initScanner()">
            <i class="fas fa-camera me-2"></i> SKANERNI YOQISH
        </button>
        <p class="mt-4 text-secondary small px-4">
            Eslatma: Rasmdagi uzun kodlarni o'qish uchun kamerani 30-40 sm uzoqlikda tuting.
        </p>
    </div>

    <!-- 2-BOSQICH: Kamera maydoni -->
    <div id="reader-wrapper" class="mt-2">
        <div class="custom-laser"></div>
        <div id="reader"></div>
        <p class="py-2 small text-secondary">Kod yashil chiziqning o'rtasida bo'lishi shart</p>
    </div>

    <!-- 3-BOSQICH: Natija va Forma -->
    <div id="result-card">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold m-0 text-success"><i class="fas fa-check-circle"></i> Skanerlandi</h5>
            <button class="btn-close" onclick="window.location.reload()"></button>
        </div>

        <div class="code-display" id="res-barcode-text">---</div>

        <form method="POST" action="{% url 'product_create' %}">
            {% csrf_token %}
            <input type="hidden" name="barcode" id="input_barcode_hidden">

            <div class="mb-3 text-start">
                <label class="form-label small fw-bold text-muted">MAHSULOT NOMI</label>
                <input type="text" name="name" class="form-control form-control-lg" placeholder="Nomi..." required>
            </div>

            <div class="row g-2 mb-4 text-start">
                <div class="col-6">
                    <label class="form-label small fw-bold text-muted">OLISH NARXI</label>
                    <input type="number" name="purchase_price" class="form-control" placeholder="0">
                </div>
                <div class="col-6">
                    <label class="form-label small fw-bold text-muted">SOTISH NARXI</label>
                    <input type="number" name="sale_price" class="form-control" placeholder="0" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-3 fw-bold rounded-3 shadow">
                <i class="fas fa-save me-2"></i> BAZAGA SAQLASH
            </button>
        </form>
    </div>

</div>

<!-- 🔊 OVOZ -->
<audio id="beep" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

<script>
    let html5QrCode;
    const beep = document.getElementById("beep");

    async function initScanner() {
        document.getElementById("init-screen").style.display = "none";
        document.getElementById("reader-wrapper").style.display = "block";

        html5QrCode = new Html5Qrcode("reader");

        // 📏 Sanoat standartidagi keng oyna (Uzun kodlar uchun)
        const qrboxFunction = (viewfinderWidth, viewfinderHeight) => {
            let width = Math.floor(viewfinderWidth * 0.95); // 95% kenglik
            let height = Math.floor(viewfinderWidth * 0.35); // Ingichka balandlik
            return { width: width, height: height };
        }

        const config = {
            fps: 30,
            qrbox: qrboxFunction,
            // Rasmdagi uzun Code 128 (GS1-128) formatiga ustunlik berish
            formatsToSupport: [ Html5QrcodeSupportedFormats.CODE_128 ],
            experimentalFeatures: {
                useBarCodeDetectorIfSupported: true
            }
        };

        // Kamera sozlamalari - MAKSIMAL TINIQLIK
        const videoConstraints = {
            facingMode: "environment",
            width: { ideal: 4096 }, // 4K gacha urinib ko'radi
            height: { ideal: 2160 },
            focusMode: "continuous"
        };

        html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
        .catch(err => {
            console.warn("Yuqori sifatda xato, Full HD ga tushildi...");
            html5QrCode.start({ facingMode: "environment" }, { fps: 20, qrbox: qrboxFunction }, onScanSuccess);
        });
    }

    function onScanSuccess(decodedText) {
        beep.play();
        html5QrCode.stop().then(() => {
            document.getElementById("reader-wrapper").style.display = "none";
            document.getElementById("result-card").style.display = "block";
            document.getElementById("res-barcode-text").innerText = decodedText;
            document.getElementById("input_barcode_hidden").value = decodedText;
        });
    }
</script>

</body>
</html>
