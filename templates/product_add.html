<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Scanner</title>

    <!-- 🔥 Quagga -->
    <script src="https://unpkg.com/quagga/dist/quagga.min.js"></script>

    <!-- UI -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background:#f0f2f5; font-family:sans-serif; }

        .scanner-card {
            border-radius:20px;
            overflow:hidden;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
        }

        /* 📱 SKANER MAYDONI - UZUNASIGA KENGAYTIRILDI */
        #reader-wrapper {
            position:relative;
            background:#000;
            min-height: 300px; /* Balandlik biroz qisqartirildi */
            display: flex;
            align-items: center;
            overflow: hidden;
        }

        #scanner {
            width:100%;
        }

        /* Video ichidagi kamerani to'g'irlash */
        #scanner video {
            width: 100%;
            height: auto;
        }

        /* Fokus ramkasi (Viewfinder) */
        .viewfinder {
            position: absolute;
            top: 50%;
            left: 5%;
            width: 90%;
            height: 120px; /* Uzun barcode uchun to'rtburchak oyna */
            margin-top: -60px;
            border: 2px solid rgba(0, 255, 0, 0.5);
            z-index: 10;
            box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.5); /* Atrofni qorong'u qilish */
            border-radius: 10px;
        }

        .laser {
            position:absolute;
            width:100%;
            height:2px;
            background:#00ff00;
            box-shadow:0 0 10px #00ff00;
            top: 50%;
            animation:move 2s infinite ease-in-out;
            z-index: 11;
        }

        @keyframes move {
            0%{top:30%}
            50%{top:70%}
            100%{top:30%}
        }

        #form-box { display:none; padding:20px; }

        /* Quagga chizgan chiziqlarni yashirish */
        canvas.drawingBuffer { display: none; }
    </style>
</head>

<body class="p-3">

<div class="container">
<div class="card scanner-card mx-auto" style="max-width:600px;">

    <!-- CAMERA -->
    <div id="reader-wrapper">
        <div class="viewfinder"></div> <!-- Fokus oynasi -->
        <div class="laser"></div>
        <div id="scanner"></div>
    </div>

    <div class="text-center py-2 bg-dark text-white" id="hint">
        <small>Uzun kodni yashil chiziqqa parallel tuting</small>
    </div>

    <!-- FORM -->
    <div id="form-box">
        <h5 class="text-success">Skanerlandi:</h5>
        <p id="code" class="fw-bold text-break"></p>

        <form method="POST" action="{% url 'product_create' %}">
            {% csrf_token %}
            <input type="hidden" name="barcode" id="barcode">
            <input type="text" name="name" placeholder="Mahsulot nomi" class="form-control mb-2" required>
            <input type="text" name="sku" placeholder="SKU" class="form-control mb-2">
            <input type="number" name="purchase_price" placeholder="Olish narxi" class="form-control mb-2">
            <input type="number" name="sale_price" placeholder="Sotish narxi" class="form-control mb-3" required>
            <button class="btn btn-primary w-100">Saqlash</button>
        </form>
        <button onclick="location.reload()" class="btn btn-link w-100 mt-2 text-muted">Qayta skanerlash</button>
    </div>

</div>
</div>

<audio id="beep" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

<script>
const beep = document.getElementById("beep");

Quagga.init({
    inputStream: {
        type: "LiveStream",
        target: document.querySelector('#scanner'),
        constraints: {
            facingMode: "environment",
            width: { min: 1280, ideal: 1920 }, // Yuqori aniqlik (HD)
            height: { min: 720, ideal: 1080 },
            aspectRatio: { min: 1, max: 2 }
        },
        // 🔥 SCAN AREA: Skanerni faqat o'rtadagi uzun chiziqni o'qishga majburlaymiz
        area: {
            top: "30%",    // Tepadan 30% pastdan boshla
            right: "5%",   // O'ngdan 5% ichkarida
            left: "5%",    // Chapdan 5% ichkarida
            bottom: "30%"  // Pastdan 30% tepada to'xta
        }
    },

    locator: {
        patchSize: "large", // Uzun kodlar uchun 'large' yaxshi ishlaydi
        halfSample: false   // Sifatni tushirmaslik (aniqroq o'qiydi)
    },

    numOfWorkers: navigator.hardwareConcurrency || 4,

    decoder: {
        readers: [
            "code_128_reader", // Birinchi navbatda rasmdagi kod turi
            "ean_reader",
            "code_39_reader",
            "i2of5_reader"
        ],
        multiple: false // Bitta kodni aniq ushlash uchun
    },

    locate: true

}, function(err) {
    if (err) {
        alert("Kamera xatosi: " + err);
        return;
    }
    Quagga.start();
});

Quagga.onDetected(function(data){
    let code = data.codeResult.code;

    // Uzun kodlarni aniqroq tekshirish (False positive-ni kamaytirish uchun)
    if (code.length > 5) {
        beep.play();
        Quagga.stop();

        document.getElementById("barcode").value = code;
        document.getElementById("code").innerText = code;

        document.getElementById("reader-wrapper").style.display = "none";
        document.getElementById("hint").style.display = "none";
        document.getElementById("form-box").style.display = "block";
    }
});

</script>

</body>
</html>
