<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahsulotlar</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f6f8;
        }

        .top-bar {
            position: sticky;
            top: 0;
            background: white;
            padding: 12px;
            z-index: 10;
            border-bottom: 1px solid #ddd;
        }

        .table-box {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        @media (max-width: 576px) {
            table {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

<div class="container py-3">

    <!-- 🔝 TOP BAR -->
    <div class="top-bar d-flex justify-content-between align-items-center mb-3 shadow-sm rounded">

        <h5 class="m-0">📦 Mahsulotlar</h5>
        <!-- 🔙 BACK -->
        <a href="javascript:history.back()" class="btn btn-outline-secondary btn-sm">
            ⬅ Orqaga
        </a>

        <!-- ➕ ADD BUTTON -->
        <a href="{% url 'product_create' %}" class="btn btn-success btn-sm">
            + Qo‘shish
        </a>

    </div>

    <!-- 📊 TABLE -->
    <div class="table-box">

        <div class="table-responsive">

            <table class="table table-striped table-hover m-0">

                <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Nomi</th>
                    <th>Barcode</th>
                    <th>Olish</th>
                    <th>Sotish</th>
                </tr>
                </thead>

                <tbody>
                {% for p in products %}
                <tr>
                    <td>{{ forloop.counter }}</td>
                    <td><b>{{ p.name }}</b></td>
                    <td>{{ p.barcode }}</td>
                    <td>{{ p.purchase_price }}</td>
                    <td>{{ p.sale_price }}</td>
                </tr>
                {% endfor %}
                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
