<!-- templates/dashboard/scan.html -->

<!DOCTYPE html>
<html>
<head>
    <title>Scan</title>

    <!-- Kamera kutubxona -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-4">

<h3>📷 Barcode Scan</h3>

<div id="reader" style="width:300px;"></div>

<br>

<form method="POST" action="{% url 'scan_submit' %}">
{% csrf_token %}

<input type="hidden" name="barcode" id="barcode">

<div class="mb-2">
<label>Product Name</label>
<input type="text" id="product_name" class="form-control" readonly>
</div>

<div class="mb-2">
<label>Quantity</label>
<input type="number" name="quantity" class="form-control" required>
</div>

<div class="mb-2">
<label>Action</label>
<select name="action" class="form-control">
<option value="income">Kirim</option>
<option value="outcome">Chiqim</option>
</select>
</div>

<button class="btn btn-success w-100 mt-2">Saqlash</button>

</form>

<script>

function onScanSuccess(decodedText) {

    html5QrCode.stop(); // kamera to'xtaydi

    document.getElementById('barcode').value = decodedText;

    // 🔥 backenddan mahsulotni olish
    fetch(`/get-product/?barcode=${decodedText}`)
    .then(res => res.json())
    .then(data => {

        if(data.success) {
            document.getElementById('product_name').value = data.name;
        } else {
            alert("❌ Mahsulot topilmadi!");
        }

    });

}

const html5QrCode = new Html5Qrcode("reader");

html5QrCode.start(
    { facingMode: "environment" },
    {
        fps: 10,
        qrbox: 250
    },
    onScanSuccess
);

</script>

</body>
</html>
