<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sklad Skaner</title>

    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <!-- 🔊 BEEP SOUND -->
    <audio id="beepSound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>

    <style>
        :root {
            --primary-color: #4f46e5;
            --success-color: #10b981;
        }

        body {
            background-color: #f3f4f6;
            font-family: 'Inter', sans-serif;
        }

        .scanner-card {
            border: none;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        /* Kamera konteyneri */
        #reader-wrapper {
            position: relative;
            background: #000;
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
        }

        #reader {
            width: 100% !important;
            border: none !important;
        }

        /* Skanerlash animatsiyasi (Yashil chiziq) */
        .scanner-laser {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--success-color);
            box-shadow: 0 0 15px var(--success-color);
            z-index: 10;
            animation: scanMove 2s infinite linear;
        }

        @keyframes scanMove {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }

        .product-found-card {
            background: #ecfdf5;
            border: 2px solid #10b981;
            border-radius: 15px;
            padding: 15px;
            margin-top: -20px;
            z-index: 20;
            position: relative;
            display: none; /* Faqat mahsulot topilganda chiqadi */
        }

        .form-control, .form-select {
            border-radius: 12px;
            padding: 12px;
            border: 1px solid #d1d5db;
        }

        .btn-save {
            background: var(--primary-color);
            color: white;
            border-radius: 12px;
            padding: 14px;
            font-weight: 600;
            border: none;
            transition: 0.3s;
        }

        .btn-save:hover {
            background: #4338ca;
            color: white;
        }

        .back-btn {
            color: #4b5563;
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body class="p-3">

<div class="container" style="max-width: 500px;">

    <!-- Dashboardga qaytish -->
    <a href="{% url 'dashboard' %}" class="back-btn">
        <i class="fas fa-arrow-left"></i> Orqaga qaytish
    </a>

    <div class="card scanner-card">
        <!-- Kamera qismi -->
        <div id="reader-wrapper">
            <div class="scanner-laser" id="laser"></div>
            <div id="reader"></div>
        </div>

        <div class="card-body">

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} small py-2">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <!-- Topilgan mahsulot vizuali -->
            <div id="product-status" class="product-found-card mb-3">
                <div class="d-flex align-items-center">
                    <div class="bg-success text-white rounded-circle p-2 me-3">
                        <i class="fas fa-check"></i>
                    </div>
                    <div>
                        <small class="text-success fw-bold">Mahsulot topildi:</small>
                        <h5 id="product_display_name" class="mb-0 text-dark fw-bold">...</h5>
                    </div>
                </div>
            </div>

            <form method="POST" action="{% url 'scan_submit' %}">
                {% csrf_token %}

                <input type="hidden" name="barcode" id="barcode_input">

                <!-- Mahsulot nomi (Yashirin yoki oddiy ko'rinishda) -->
                <div id="name-input-group" class="mb-3">
                    <label class="form-label small fw-bold text-secondary text-uppercase">Mahsulot nomi:</label>
                    <input type="text" id="product_name_input" class="form-control bg-light" placeholder="Skanerlang..." readonly>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary text-uppercase">Ombor:</label>
                    <select name="warehouse" class="form-select shadow-sm" required>
                        <option value="">-- Tanlang --</option>
                        {% for w in warehouses %}
                            <option value="{{ w.id }}">{{ w.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="row g-2">
                    <div class="col-6 mb-3">
                        <label class="form-label small fw-bold text-secondary text-uppercase">Miqdor:</label>
                        <input type="number" name="quantity" class="form-control shadow-sm" value="1" min="1" required>
                    </div>

                    <div class="col-6 mb-3">
                        <label class="form-label small fw-bold text-secondary text-uppercase">Harakat:</label>
                        <select name="action" class="form-select shadow-sm fw-bold text-primary">
                            <option value="income">KIRIM (+)</option>
                            <option value="outcome">CHIQIM (-)</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn btn-save w-100 shadow">
                    <i class="fas fa-save me-2"></i> SAQLASH
                </button>

                <button type="button" onclick="restartScanner()" class="btn btn-light w-100 mt-2 border text-secondary small">
                    <i class="fas fa-sync me-2"></i> Qayta skanerlash
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    let html5QrCode = new Html5Qrcode("reader");
    let scanning = true;

    function onScanSuccess(decodedText) {
        if (!scanning) return;
        scanning = false;

        document.getElementById("beepSound").play();
        document.getElementById('barcode_input').value = decodedText;
        document.getElementById('laser').style.display = 'none'; // Animatsiyani to'xtatish

        fetch("{% url 'get_product' %}?barcode=" + decodedText)
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    // Vizual effektlar
                    document.getElementById('product-status').style.display = 'block';
                    document.getElementById('product_display_name').innerText = data.name;
                    document.getElementById('product_name_input').value = data.name;
                    document.getElementById('name-input-group').style.display = 'none'; // Pastki inputni yashirish
                } else {
                    alert("❌ Mahsulot topilmadi: " + decodedText);
                    restartScanner();
                }
            })
            .catch(err => {
                alert("❌ Aloqa xatosi!");
                restartScanner();
            })
            .finally(() => {
                html5QrCode.stop();
            });
    }

    function restartScanner() {
        document.getElementById('product-status').style.display = 'none';
        document.getElementById('name-input-group').style.display = 'block';
        document.getElementById('product_name_input').value = "";
        document.getElementById('barcode_input').value = "";
        document.getElementById('laser').style.display = 'block';

        scanning = true;

        html5QrCode.start(
            { facingMode: "environment" },
            { fps: 15, qrbox: {width: 250, height: 250} },
            onScanSuccess
        ).catch(err => console.error("Kamera yoqilmadi", err));
    }

    // Start
    restartScanner();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
